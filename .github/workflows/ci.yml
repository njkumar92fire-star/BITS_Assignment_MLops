name: MLOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install flake8
      - name: flake8
        run: flake8 . --count --show-source --statistics

  test:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: |
          pytest -v --cov=src --cov=api --cov-report=xml --cov-report=term-missing \
                 --junitxml=pytest-report.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            pytest-report.xml
            coverage.xml

  train:
    name: Train model and log to MLflow
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check the download script still works
        continue-on-error: true   # UCI can be briefly unavailable; the cleaned CSV is committed
        run: python -m src.download_data
      - name: Train
        run: python -m src.train 2>&1 | tee train.log
      - name: Upload model, metrics and MLflow data
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/
            mlflow.db
            mlartifacts/
            reports/figures/
            train.log

  docker:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    needs: train
    steps:
      - uses: actions/checkout@v4
      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts
          path: artifacts
      - name: Use the model trained in this run
        run: cp artifacts/models/* models/
      - name: Build image
        run: docker build -t heart-api:ci .
      - name: Run container
        run: docker run -d --name heart-api -p 8000:8000 heart-api:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break || sleep 2
          done
          curl -sf http://localhost:8000/health
          curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"age":63,"sex":1,"cp":1,"trestbps":145,"chol":233,"fbs":1,"restecg":2,"thalach":150,"exang":0,"oldpeak":2.3,"slope":3,"ca":0,"thal":6}' \
            | tee prediction.json
          curl -sf http://localhost:8000/metrics | grep heart_api_requests_total
      - name: Collect container logs
        if: always()
        run: docker logs heart-api > container.log 2>&1 || true
      - name: Upload smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-smoke-test
          path: |
            prediction.json
            container.log
